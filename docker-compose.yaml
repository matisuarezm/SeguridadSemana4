services:
  jenkins:
    container_name: jenkins
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
    networks:
      - net
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
      - JENKINS_SLAVE_AGENT_PORT=50000
    restart: always

  sonarqube:
    container_name: sonarqube
    image: sonarqube:latest
    ports:
      - "9000:9000"
    networks:
      - net
    environment:
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    restart: always

  mysql:
    container_name: mysql-semana4
    image: mysql-semana4:latest
    ports:
      - "3306:3306"
    networks:
      - net
    restart: always

networks:
  net:
    driver: bridge